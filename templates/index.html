<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>50嵐線上點餐系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #006633; }
        .row { display: flex; gap: 20px; }
        .col { flex: 1; background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        select, input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #006633; color: white; border: none; padding: 10px 15px; margin-top: 15px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #004d26; }
        .cart-item { border-bottom: 1px dashed #ccc; padding: 8px 0; font-size: 14px; }
        .total { font-size: 18px; font-weight: bold; color: #d9534f; text-align: right; margin-top: 15px; }
        .clear-btn { background-color: #d9534f; margin-top: 10px; }
        .clear-btn:hover { background-color: #c9302c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍹 50嵐 線上點餐系統（網頁版）</h1>
        <div class="row">
            <!-- 左側：點餐表單 -->
            <div class="col">
                <h3>選擇商品</h3>
                <form action="/add" method="POST">
                    <label>品項與價格：</label>
                    <select name="item_id">
                        {% for item in menu %}
                            <option value="{{ item.id }}">{{ item.name }} (中M:${item.M} / 大L:${item.L})</option>
                        {% endfor %}
                    </select>

                    <label>容量：</label>
                    <select name="size">
                        <option value="M">中杯 (M)</option>
                        <option value="L">大杯 (L)</option>
                    </select>

                    <label>甜度：</label>
                    <select name="sugar">
                        {% for sugar in sugar_options %}
                            <option value="{{ sugar }}">{{ sugar }}</option>
                        {% endfor %}
                    </select>

                    <label>冰塊：</label>
                    <select name="ice">
                        {% for ice in ice_options %}
                            <option value="{{ ice }}">{{ ice }}</option>
                        {% endfor %}
                    </select>

                    <label>數量：</label>
                    <input type="number" name="qty" value="1" min="1" max="20">

                    <button type="submit">加入購物車</button>
                </form>
            </div>

            <!-- 右側：購物車與結帳 -->
            <div class="col">
                <h3>🛒 購物車清單</h3>
                {% if cart %}
                    {% for item in cart %}
                        <div class="cart-item">
                            <b>{{ item.name }}</b> ({{ item.size }})<br>
                            {{ item.sugar }} / {{ item.ice }} | 數量: {{ item.qty }}<br>
                            小計: ${{ item.total }}
                        </div>
                    {% endfor %}
                    <div class="total">總計金額: ${{ total_amount }} 元</div>
                    <form action="/clear">
                        <button type="submit" class="clear-btn">清空購物車</button>
                    </form>
                {% else %}
                    <p style="color: #888; text-align: center; margin-top: 40px;">目前購物車是空的</p>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
