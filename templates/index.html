<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上點餐系統</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <h2 class="text-center mb-4">線上點餐系統</h2>

        <!-- 點餐表單 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form action="/add" method="POST">
                    <div class="form-group">
                        <label for="item_id">選擇品項：</label>
                        <select name="item_id" id="item_id" class="form-control" required>
                            <option value="">-- 請選擇餐點品項 --</option>
                            {% for item in menu %}
                                <option value="{{ item.id }}">[{{ item.brand }}] {{ item.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="sweetness">甜度：</label>
                            <select name="sweetness" id="sweetness" class="form-control" required>
                                <option value="正常甜">正常甜 (100%)</option>
                                <option value="少糖">少糖 (70%)</option>
                                <option value="半糖">半糖 (50%)</option>
                                <option value="微糖">微糖 (30%)</option>
                                <option value="無糖">無糖 (0%)</option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="ice">冰塊：</label>
                            <select name="ice" id="ice" class="form-control" required>
                                <option value="正常冰">正常冰</option>
                                <option value="少冰">少冰</option>
                                <option value="微冰">微冰</option>
                                <option value="去冰">去冰</option>
                                <option value="完全去冰">完全去冰</option>
                                <option value="溫熱飲">溫 / 熱</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="qty">數量：</label>
                        <input type="number" name="qty" id="qty" class="form-control" value="1" min="1" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">加入訂單</button>
                </form>
            </div>
        </div>

        <!-- 訂單列表 -->
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">目前訂單紀錄</h5>
                <form action="/clear" method="POST" class="mb-0">
                    <button type="submit" class="btn btn-danger btn-sm">清除所有紀錄</button>
                </form>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>品牌</th>
                                <th>品項名稱</th>
                                <th>甜度</th>
                                <th>冰塊</th>
                                <th>數量</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for order in orders %}
                            <tr>
                                <td>{{ loop.index }}</td>
                                <td>{{ order.brand }}</td>
                                <td>{{ order.item_name }}</td>
                                <td>{{ order.sweetness }}</td>
                                <td>{{ order.ice }}</td>
                                <td>{{ order.qty }}</td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="6" class="text-center text-muted">目前尚無點餐紀錄</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
