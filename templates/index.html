<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上點餐系統</title>
    <!-- 引入 Bootstrap CSS 讓畫面更整齊 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">線上點餐系統</h2>

        <!-- 點餐表單 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form action="/add" method="POST">
                    <div class="form-group">
                        <label for="item_id">選擇品項：</label>
                        <select name="item_id" id="item_id" class="form-control" required>
                            <option value="">-- 請選擇餐點品項 --</option>
                            {% for item in menu %}
                                <option value="{{ item.id }}">[{{ item.brand }}] {{ item.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="qty">數量：</label>
                        <input type="number" name="qty" id="qty" class="form-control" value="1" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">加入訂單</button>
                </form>
            </div>
        </div>

        <!-- 訂單列表 -->
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">目前訂單紀錄</h5>
                <form action="/clear" method="POST" class="mb-0">
                    <button type="submit" class="btn btn-danger btn-sm">清除所有紀錄</button>
                </form>
            </div>
            <div class="card-body">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>品牌</th>
                            <th>品項名稱</th>
                            <th>數量</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for order in orders %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>{{ order.brand }}</td>
                            <td>{{ order.item_name }}</td>
                            <td>{{ order.qty }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">目前尚無點餐紀錄</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
